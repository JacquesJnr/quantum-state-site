name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Build Quartz
        run: npx quartz build
      - name: Write llms.txt
        run: node scripts/llms.mjs
      - name: Sync generated files to llms branch
        shell: bash
        run: |
          set -euo pipefail
          output_dir=$(mktemp -d)
          remote_ref=$(git ls-remote --heads origin refs/heads/llms)
          if [ -n "$remote_ref" ]; then
            git fetch origin refs/heads/llms
            git worktree add --detach "$output_dir" FETCH_HEAD
          else
            git worktree add --detach "$output_dir" HEAD
            git -C "$output_dir" switch --orphan llms
          fi

          cp public/llms.txt public/llms-full.txt "$output_dir/"
          git -C "$output_dir" config user.name "github-actions[bot]"
          git -C "$output_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$output_dir" add -- llms.txt llms-full.txt
          if ! git -C "$output_dir" diff --cached --quiet; then
            git -C "$output_dir" commit -m "Update llms files from ${GITHUB_SHA}"
            git -C "$output_dir" push origin HEAD:refs/heads/llms
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
